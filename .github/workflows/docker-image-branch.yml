name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build (e.g. alpha, nightly)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-branch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
      image_name: ${{ steps.version.outputs.image_name }}
      ci_target: ${{ steps.version.outputs.ci_target }}
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/${{ inputs.branch }}

      - name: Resolve Docker tags
        id: version
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          # Include the date, abbreviated commit and architecture in the 128-character limit.
          MAX_PREFIX_LENGTH=$((112 - ${#SHORT_SHA}))
          TAG_PREFIX=${TAG_PREFIX:0:MAX_PREFIX_LENGTH}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [[ -z "$TAG_PREFIX" ]]; then
            echo "::error::Branch '$BRANCH_NAME' cannot be converted to a valid Docker tag prefix"
            exit 1
          fi
          VERSION="${TAG_PREFIX}-$(date +'%Y%m%d')-${SHORT_SHA}"
          {
            echo "sha=$SHA"
            echo "tag_prefix=$TAG_PREFIX"
            echo "version=$VERSION"
            echo "image_name=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
          # Older tags/branches retain their original, self-contained Dockerfile.
          if grep -Eiq '^FROM .* AS ci-runtime([[:space:]]|$)' Dockerfile; then
            echo "ci_target=ci-runtime" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: prepare
    if: needs.prepare.outputs.ci_target == 'ci-runtime'
    uses: ./.github/workflows/build-frontend.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare, frontend]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.prepare.outputs.ci_target != 'ci-runtime' || needs.frontend.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      GOWORK: 'off'
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOEXPERIMENT: greenteagc
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        if: needs.prepare.outputs.ci_target == 'ci-runtime'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Download frontend
        if: needs.prepare.outputs.ci_target == 'ci-runtime'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact_id }}
          path: web/dist
          merge-multiple: true

      - name: Write VERSION
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Build backend
        if: needs.prepare.outputs.ci_target == 'ci-runtime'
        run: |
          test -s web/dist/index.html
          mkdir -p build
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o build/new-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ needs.prepare.outputs.ci_target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag_prefix }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-branch-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-branch-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/image-digests/$ARCH"
          {
            echo "### Docker Image Digest ($ARCH)"
            echo "${IMAGE_NAME}:${VERSION}-$ARCH"
            echo "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [prepare, build_single_arch]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build_single_arch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ALIAS: ${{ needs.prepare.outputs.tag_prefix }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests
        id: manifest
        run: |
          AMD64_DIGEST=$(cat digests/amd64)
          ARM64_DIGEST=$(cat digests/arm64)
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/manifest.json" \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:${ALIAS}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"
          DIGEST=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/manifest.json")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifest with cosign
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Manifest summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### Multi-arch Manifest"
            echo "${IMAGE_NAME}:${VERSION}"
            echo "${IMAGE_NAME}:${ALIAS}"
            docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
