name: Publish Docker image (manual branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build (e.g. alpha, nightly)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag_prefix: ${{ steps.version.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
    env:
      BRANCH_NAME: ${{ inputs.branch }}
    steps:
      - name: Validate branch reference
        run: git check-ref-format "refs/heads/$BRANCH_NAME"

      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/${{ inputs.branch }}

      - name: Resolve Docker tags
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          # Leave room for the date, commit abbreviation, and architecture suffix.
          MAX_PREFIX=$((112 - ${#SHORT_SHA}))
          TAG_PREFIX=${TAG_PREFIX:0:MAX_PREFIX}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [[ -z "$TAG_PREFIX" || "$TAG_PREFIX" =~ ^latest(-amd64|-arm64)?$ ]]; then
            echo '::error::Branch must produce a nonempty Docker tag prefix and cannot use a reserved latest tag'
            exit 1
          fi
          VERSION="${TAG_PREFIX}-$(date -u +'%Y%m%d')-${SHORT_SHA}"
          {
            echo "sha=$SHA"
            echo "tag_prefix=$TAG_PREFIX"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      alias: ${{ needs.prepare.outputs.tag_prefix }}
      cache-scope: docker-branch
