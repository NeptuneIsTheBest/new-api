name: Sync Release to GitCode

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to sync
        required: true
        type: string
      sync_files:
        description: Sync GitHub release files to GitCode
        required: false
        default: false
        type: boolean

concurrency:
  group: gitcode-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create or update GitCode release
    if: ${{ vars.GITCODE_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_body: ${{ steps.release.outputs.body }}
      release_prerelease: ${{ steps.release.outputs.prerelease }}
      release_asset_matrix: ${{ steps.assets.outputs.matrix }}
      has_release_assets: ${{ steps.assets.outputs.has_assets }}
    steps:
      - name: Create or update GitCode release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body,isPrerelease
          )"
          release_body="$(jq -r '.body // ""' <<< "$release_json" | sed "s/'/’/g")"
          release_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
          if [[ "$release_prerelease" == "true" ]]; then
            release_status=pre
          else
            release_status=latest
          fi

          gitcode_release_json="$(mktemp)"
          gitcode_release_status="$(
            curl -L -sS -o "$gitcode_release_json" -w "%{http_code}" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              -H "Accept: application/json" \
              "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"

          request_json="$(mktemp)"
          case "$gitcode_release_status" in
            200)
              request_method=PATCH
              request_url="https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/$RELEASE_TAG"
              request_action=update
              success_action=updated
              ;;
            404)
              if ! git ls-remote --exit-code --tags \
                "https://gitcode.com/$GITCODE_REPOSITORY.git" \
                "refs/tags/$RELEASE_TAG" > /dev/null; then
                echo "::error::Tag $RELEASE_TAG has not been mirrored to GitCode yet. Retry this workflow after the tag appears on GitCode."
                exit 1
              fi
              request_method=POST
              request_url="https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases"
              request_action=create
              success_action=created
              ;;
            *)
              echo "::error::Failed to inspect GitCode release. Response code: $gitcode_release_status"
              cat "$gitcode_release_json"
              exit 1
              ;;
          esac

          jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg name "$RELEASE_TAG" \
            --arg body "$release_body" \
            --arg release_status "$release_status" \
            '{
              tag_name: $tag_name,
              name: $name,
              body: $body,
              release_status: $release_status
            }' > "$request_json"

          gitcode_response_json="$(mktemp)"
          request_status="$(
            curl -L -sS -o "$gitcode_response_json" -w "%{http_code}" \
              -X "$request_method" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary "@$request_json" \
              "$request_url"
          )"
          if [[ "$request_status" != "200" ]]; then
            echo "::error::Failed to $request_action GitCode release. Response code: $request_status"
            cat "$gitcode_response_json"
            exit 1
          fi
          echo "GitCode release $success_action successfully"

          delimiter="release-body-$(openssl rand -hex 16)"
          {
            echo "tag=$RELEASE_TAG"
            echo "body<<$delimiter"
            echo "$release_body"
            echo "$delimiter"
            echo "prerelease=$release_prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare missing release assets
        id: assets
        if: ${{ inputs.sync_files }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          github_release_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id'
          )"
          github_assets="$(
            gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/releases/$github_release_id/assets?per_page=100" \
              | jq -c '[.[][] | {
                  asset_id: .id,
                  source_name: .name,
                  file_name: (.name | gsub("[^A-Za-z0-9._+\\-]"; "-")),
                  size: .size
                }]'
          )"
          if [[ "$(jq -r 'length' <<< "$github_assets")" == "0" ]]; then
            echo "::error::GitHub release has no downloadable assets"
            exit 1
          fi

          filename_collisions="$(
            jq -r '
              group_by(.file_name)
              | map(select(length > 1) | .[0].file_name)
              | join(", ")
            ' <<< "$github_assets"
          )"
          if [[ -n "$filename_collisions" ]]; then
            echo "::error::Asset filename collision after normalization: $filename_collisions"
            exit 1
          fi

          gitcode_release_json="$(mktemp)"
          gitcode_release_status="$(
            curl -L -sS -o "$gitcode_release_json" -w "%{http_code}" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              -H "Accept: application/json" \
              "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"
          if [[ "$gitcode_release_status" != "200" ]]; then
            echo "::error::Failed to inspect GitCode release assets. Response code: $gitcode_release_status"
            cat "$gitcode_release_json"
            exit 1
          fi

          existing_assets="$(jq -c '[.assets[]?.name]' "$gitcode_release_json")"
          missing_assets="$(
            jq -cn \
              --argjson github_assets "$github_assets" \
              --argjson existing_assets "$existing_assets" \
              '$github_assets
                | map(select(.file_name as $name | ($existing_assets | index($name)) == null))
                | sort_by(-.size)'
          )"
          jq -rn \
            --argjson github_assets "$github_assets" \
            --argjson missing_assets "$missing_assets" \
            '$github_assets - $missing_assets | .[] | "Skipping existing GitCode asset: \(.file_name)"'

          echo "matrix=$missing_assets" >> "$GITHUB_OUTPUT"
          echo "has_assets=$(jq -r 'length > 0' <<< "$missing_assets")" >> "$GITHUB_OUTPUT"

  gitcode-release-assets:
    name: Publish GitCode asset (${{ matrix.asset.file_name }})
    needs: prepare-release
    if: ${{ inputs.sync_files && needs.prepare-release.result == 'success' && needs.prepare-release.outputs.has_release_assets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        asset: ${{ fromJSON(needs.prepare-release.outputs.release_asset_matrix) }}
    steps:
      - name: Download GitHub release asset
        env:
          ASSET_ID: ${{ matrix.asset.asset_id }}
          EXPECTED_SIZE: ${{ matrix.asset.size }}
          FILE_NAME: ${{ matrix.asset.file_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir release-asset
          gh api \
            -H "Accept: application/octet-stream" \
            "/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            > "release-asset/$FILE_NAME"

          actual_size="$(stat -c '%s' "release-asset/$FILE_NAME")"
          if [[ "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "::error::Downloaded asset size mismatch for $FILE_NAME: expected $EXPECTED_SIZE, got $actual_size"
            exit 1
          fi

      - name: Upload asset to GitCode
        env:
          FILE_NAME: ${{ matrix.asset.file_name }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          upload_info="$(
            curl -L -sS --fail-with-body --get \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              -H "Accept: application/json" \
              --data-urlencode "file_name=$FILE_NAME" \
              "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/$RELEASE_TAG/upload_url"
          )"
          upload_url="$(jq -er '.url' <<< "$upload_info")"
          curl_headers=()
          while IFS= read -r header; do
            if [[ -n "$header" ]]; then
              curl_headers+=("-H" "$header")
            fi
          done < <(jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"' <<< "$upload_info")

          upload_response="$(mktemp)"
          upload_status="$(
            curl -L -sS -o "$upload_response" -w "%{http_code}" \
              -X PUT \
              --retry 3 \
              --retry-all-errors \
              -T "release-asset/$FILE_NAME" \
              "${curl_headers[@]}" \
              "$upload_url"
          )"
          if [[ "$upload_status" != "200" ]]; then
            echo "::error::Failed to upload $FILE_NAME. Response code: $upload_status"
            cat "$upload_response"
            exit 1
          fi
          echo "Uploaded $FILE_NAME successfully"
