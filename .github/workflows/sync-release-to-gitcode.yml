name: Sync Release to GitCode

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to sync
        required: true
        type: string
      sync_files:
        description: Sync GitHub release files to GitCode
        required: false
        default: false
        type: boolean

concurrency:
  group: gitcode-release-${{ inputs.tag_name }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-release:
    name: Create or update GitCode release
    if: ${{ vars.GITCODE_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_asset_matrix: ${{ steps.assets.outputs.matrix }}
      has_release_assets: ${{ steps.assets.outputs.has_assets }}
    env:
      GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - name: Create or update GitCode release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag" > "$RUNNER_TEMP/github-release.json"
          release_body=$(jq -r '.body // ""' "$RUNNER_TEMP/github-release.json")
          release_prerelease=$(jq -r '.prerelease' "$RUNNER_TEMP/github-release.json")
          if [[ "$release_prerelease" == true ]]; then
            release_status=pre
          else
            release_status=latest
          fi

          gitcode_release_json=$(mktemp)
          gitcode_release_status=$(
            curl -L -sS --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 --retry-max-time 60 \
              -o "$gitcode_release_json" -w '%{http_code}' \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H 'Accept: application/json' \
              "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/tags/$encoded_tag"
          )
          case "$gitcode_release_status" in
            200)
              request_method=PATCH
              request_url="https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/$encoded_tag"
              ;;
            404)
              if ! git ls-remote --exit-code --tags "https://gitcode.com/$GITCODE_REPOSITORY.git" "refs/tags/$RELEASE_TAG" > /dev/null; then
                echo '::error::Tag has not been mirrored to GitCode yet. Retry after it appears on GitCode.'
                exit 1
              fi
              request_method=POST
              request_url="https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases"
              ;;
            *)
              echo "::error::Failed to inspect GitCode release. Response code: $gitcode_release_status"
              cat "$gitcode_release_json"
              exit 1
              ;;
          esac

          request_json=$(mktemp)
          jq -n --arg tag_name "$RELEASE_TAG" --arg body "$release_body" --arg release_status "$release_status" \
            '{tag_name: $tag_name, name: $tag_name, body: $body, release_status: $release_status}' > "$request_json"
          gitcode_response_json=$(mktemp)
          # A timed-out write may already have succeeded; leave reconciliation to a rerun.
          request_status=$(
            curl -L -sS --connect-timeout 10 --max-time 120 \
              -o "$gitcode_response_json" -w '%{http_code}' -X "$request_method" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data-binary "@$request_json" "$request_url"
          )
          if [[ "$request_status" != 200 ]]; then
            echo "::error::Failed to publish GitCode release. Response code: $request_status"
            cat "$gitcode_response_json"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare missing GitCode assets
        id: assets
        if: ${{ inputs.sync_files }}
        run: |
          set -euo pipefail
          local_assets=$(jq -c '[.assets[] | {id, size, name: (.name | gsub("[^A-Za-z0-9._+-]"; "-"))}] | sort_by(.size, .name)' "$RUNNER_TEMP/github-release.json")
          if [[ $(jq 'length' <<< "$local_assets") == 0 ]]; then
            echo '::error::GitHub release has no downloadable assets'
            exit 1
          fi
          if ! jq -e 'all(.[]; .name != "" and .name != "." and .name != "..") and (group_by(.name) | all(.[]; length == 1))' <<< "$local_assets" > /dev/null; then
            echo '::error::Invalid asset filename or filename collision after normalization'
            exit 1
          fi

          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          gitcode_release_json=$(mktemp)
          gitcode_release_status=$(
            curl -L -sS --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 --retry-max-time 60 \
              -o "$gitcode_release_json" -w '%{http_code}' \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H 'Accept: application/json' \
              "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/tags/$encoded_tag"
          )
          if [[ "$gitcode_release_status" != 200 ]]; then
            echo "::error::Failed to inspect GitCode release assets. Response code: $gitcode_release_status"
            cat "$gitcode_release_json"
            exit 1
          fi
          existing_assets=$(jq -c '[.assets[]?.name]' "$gitcode_release_json")
          jq --argjson existing "$existing_assets" \
            'map(select(.name as $name | $existing | index($name) | not))' \
            <<< "$local_assets" > "$RUNNER_TEMP/missing-release-assets.json"
          {
            echo "matrix=$(jq -c 'map(.name)' "$RUNNER_TEMP/missing-release-assets.json")"
            echo "has_assets=$(jq 'length > 0' "$RUNNER_TEMP/missing-release-assets.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download missing GitHub assets
        if: ${{ inputs.sync_files && steps.assets.outputs.has_assets == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS=$'\t' read -r asset_id filename; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H 'Accept: application/octet-stream' > "release-assets/$filename"
          done < <(jq -r '.[] | [.id, .name] | @tsv' "$RUNNER_TEMP/missing-release-assets.json")

      - name: Upload missing assets for GitCode
        if: ${{ inputs.sync_files && steps.assets.outputs.has_assets == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitcode-release-assets
          path: release-assets/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  gitcode-release-assets:
    name: Publish GitCode asset (${{ matrix.file_name }})
    needs: prepare-release
    if: ${{ inputs.sync_files && needs.prepare-release.result == 'success' && needs.prepare-release.outputs.has_release_assets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file_name: ${{ fromJSON(needs.prepare-release.outputs.release_asset_matrix) }}
    steps:
      - name: Download missing release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitcode-release-assets
          path: release-assets

      - name: Upload GitCode asset
        env:
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          FILE_NAME: ${{ matrix.file_name }}
        run: |
          set -euo pipefail
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          encoded_filename=$(jq -rn --arg name "$FILE_NAME" '$name | @uri')
          upload_info=$(curl -fLsS --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 2 --retry-max-time 60 \
            -H "PRIVATE-TOKEN: $GITCODE_TOKEN" -H 'Accept: application/json' \
            "https://api.gitcode.com/api/v5/repos/$GITCODE_REPOSITORY/releases/$encoded_tag/upload_url?file_name=$encoded_filename")
          upload_url=$(jq -er '.url | select(startswith("https://"))' <<< "$upload_info")
          curl_headers=()
          while IFS= read -r header; do
            curl_headers+=(-H "$header")
          done < <(jq -r '(.headers // {}) | to_entries[] | "\(.key): \(.value)"' <<< "$upload_info")
          response_json=$(mktemp)
          response_status=$(curl -sS --connect-timeout 10 --max-time 600 -X PUT \
            -o "$response_json" -w '%{http_code}' -T "release-assets/$FILE_NAME" \
            "${curl_headers[@]}" "$upload_url")
          if [[ "$response_status" != 200 ]]; then
            echo "::error::Failed to upload GitCode asset. Response code: $response_status"
            cat "$response_json"
            exit 1
          fi
          echo "Uploaded $FILE_NAME"
