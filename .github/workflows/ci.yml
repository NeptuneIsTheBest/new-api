name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    if: github.event.action != 'closed' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Detect changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Post-merge checks also populate caches on the target branch.
          backend=true
          frontend=true
          if [[ "$EVENT_NAME" == pull_request && "$EVENT_ACTION" != closed ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
               git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
              backend=false
              frontend=false
              while IFS= read -r -d '' file; do
                case "$file" in
                  AGENTS.md|*/AGENTS.md|.agents/*.md|README*|.github/*.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE/*)
                    ;;
                  web/*)
                    frontend=true
                    ;;
                  *.go|go.mod|go.sum|relaykit/*|tokenkit/*|common/*|constant/*|controller/*|dto/*|i18n/*|logger/*|middleware/*|model/*|oauth/*|pkg/*|plugins/*|relay/*|router/*|service/*|setting/*|types/*|docs/plugin-api/v1.schema.json|docs/plugin-api/v1.d.ts)
                    backend=true
                    ;;
                  docs/*)
                    ;;
                  *)
                    backend=true
                    frontend=true
                    ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            else
              echo "::warning::Could not determine changed files; running all checks"
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend vet, build, and test
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event.action != 'closed' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref != 'main')) &&
          (needs.changes.result != 'success' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event.action != 'closed' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref != 'main')) &&
          (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
