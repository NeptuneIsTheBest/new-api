name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Docker release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      alias: ${{ steps.version.outputs.alias }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          git check-ref-format "refs/tags/$TAG"
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ || "$TAG" =~ ^latest(-amd64|-arm64)?$ ]]; then
            echo '::error::Tag must fit a Docker tag with its architecture suffix and cannot use a reserved latest tag'
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ALIAS=''
          if [[ "$TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            ALIAS=latest
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$TAG"
            echo "alias=$ALIAS"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      alias: ${{ needs.prepare.outputs.alias }}
      cache-scope: docker-release
