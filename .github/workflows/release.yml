name: Release (Linux, macOS, Windows)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

defaults:
  run:
    shell: bash

env:
  GOWORK: 'off'

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 0 }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    uses: ./.github/workflows/build-frontend.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            prefix: new-api-
            suffix: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            prefix: new-api-arm64-
            suffix: ''
          - target: macos
            runner: macos-latest
            prefix: new-api-macos-
            suffix: ''
          - target: windows
            runner: windows-latest
            prefix: new-api-
            suffix: .exe
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BINARY_NAME: ${{ matrix.prefix }}${{ needs.prepare.outputs.version }}${{ matrix.suffix }}
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.frontend.outputs.artifact-name }}
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Build backend
        run: |
          go mod download
          LDFLAGS="-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'"
          if [[ "$RUNNER_OS" == Linux ]]; then
            LDFLAGS="-s -w $LDFLAGS -extldflags '-static'"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            LDFLAGS="-s -w $LDFLAGS"
          fi
          mkdir -p release-assets
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "$LDFLAGS" -o "release-assets/$BINARY_NAME"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  collect:
    name: Collect release assets and checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum "new-api-$VERSION" "new-api-arm64-$VERSION" > checksums-linux.txt
          sha256sum "new-api-macos-$VERSION" > checksums-macos.txt
          sha256sum "new-api-$VERSION.exe" > checksums-windows.txt
          sha256sum --check checksums-linux.txt checksums-macos.txt checksums-windows.txt

      - name: Name release artifact
        id: artifact
        run: echo "artifact-name=release-assets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: [prepare, collect]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.collect.outputs.artifact-name }}
          path: release-assets

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
