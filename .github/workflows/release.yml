name: Release (Linux, macOS, Windows)

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

permissions:
  contents: read

jobs:
  prepare:
    name: Build shared frontend
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(git describe --tags --match 'v[0-9]*')"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          CI: ''
        run: DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Upload frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos
            runner: macos-latest
          - target: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Prepare output directory
        run: mkdir -p release

      - name: Build Linux amd64
        if: matrix.target == 'linux-amd64'
        run: >-
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build
          -ldflags "-s -w -X 'new-api/common.Version=$VERSION' -extldflags '-static'"
          -o "release/new-api-$VERSION"

      - name: Build Linux arm64
        if: matrix.target == 'linux-arm64'
        run: >-
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build
          -ldflags "-s -w -X 'new-api/common.Version=$VERSION' -extldflags '-static'"
          -o "release/new-api-arm64-$VERSION"

      - name: Build macOS
        if: matrix.target == 'macos'
        run: >-
          go build
          -ldflags "-X 'new-api/common.Version=$VERSION'"
          -o "release/new-api-macos-$VERSION"

      - name: Build Windows
        if: matrix.target == 'windows'
        run: >-
          go build
          -ldflags "-s -w -X 'new-api/common.Version=$VERSION'"
          -o "release/new-api-$VERSION.exe"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish-server:
    name: Publish server release
    needs: [prepare, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum "new-api-$VERSION" "new-api-arm64-$VERSION" > checksums-linux.txt
          sha256sum "new-api-macos-$VERSION" > checksums-macos.txt
          sha256sum "new-api-$VERSION.exe" > checksums-windows.txt

      - name: Upload server release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            release/new-api-*
            release/checksums-*.txt

  electron:
    name: Build Electron app
    needs: [prepare, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-windows
          path: server

      - name: Prepare Windows binary
        run: cp "server/new-api-$VERSION.exe" new-api.exe

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Update Electron version
        working-directory: electron
        run: |
          ELECTRON_VERSION="${VERSION#v}"
          if [[ $ELECTRON_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            ELECTRON_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
          fi
          npm version "$ELECTRON_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron app
        working-directory: electron
        run: npm run build:win

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 1

  publish-electron:
    name: Publish Electron release
    needs: electron
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Electron artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: windows-build

      - name: Upload Electron release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: windows-build/*.exe
