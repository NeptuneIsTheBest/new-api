name: Release (Linux, macOS, Windows)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 0 }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    uses: ./.github/workflows/build-frontend.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            binary: new-api-${{ needs.prepare.outputs.version }}
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: new-api-arm64-${{ needs.prepare.outputs.version }}
          - target: macos
            runner: macos-latest
            binary: new-api-macos-${{ needs.prepare.outputs.version }}
          - target: windows
            runner: windows-latest
            binary: new-api-${{ needs.prepare.outputs.version }}.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.26'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Download frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact_id }}
          path: web/dist
          merge-multiple: true

      - name: Build backend
        run: |
          test -s web/dist/index.html
          mkdir -p build
          LDFLAGS="-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'"
          case "$TARGET" in
            linux-amd64)
              LDFLAGS+=" -extldflags '-static'"
              ;;
            linux-arm64)
              export CGO_ENABLED=1 GOOS=linux GOARCH=arm64
              LDFLAGS+=" -extldflags '-static'"
              ;;
            macos)
              LDFLAGS="-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'"
              ;;
          esac
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "$LDFLAGS" -o "build/$BINARY_NAME"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.target }}
          path: build/${{ matrix.binary }}
          if-no-files-found: error
          overwrite: true
          compression-level: 1
          retention-days: 7

  release:
    name: Publish server release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum "new-api-arm64-$VERSION" "new-api-$VERSION" > checksums-linux.txt
          sha256sum "new-api-macos-$VERSION" > checksums-macos.txt
          sha256sum "new-api-$VERSION.exe" > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            release/new-api-*
            release/checksums-*.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
