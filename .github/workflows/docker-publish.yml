name: Publish Docker artifacts

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string
      version:
        description: Version tag and embedded application version
        required: true
        type: string
      alias:
        description: Optional rolling tag
        default: ''
        type: string
      cache-scope:
        description: Cache namespace for the calling entry point
        required: true
        type: string
    outputs:
      image:
        description: GHCR image repository
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Published multi-architecture manifest digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ inputs.sha }}
  VERSION: ${{ inputs.version }}
  ALIAS: ${{ inputs.alias }}

jobs:
  build:
    name: Build and sign (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Validate build inputs
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ || ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ ]]; then
            echo '::error::A commit SHA and a valid version tag including room for the architecture suffix are required'
            exit 1
          fi
          if [[ "$VERSION" =~ ^latest(-amd64|-arm64)?$ || "$ALIAS" =~ ^latest-(amd64|arm64)$ ]]; then
            echo '::error::Reserved latest tags cannot be used as version or architecture aliases'
            exit 1
          fi
          if [[ -n "$ALIAS" && ! "$ALIAS" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ ]]; then
            echo '::error::Invalid rolling Docker tag'
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}

      - name: Prepare build
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$VERSION" > VERSION
          IMAGE_NAME=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ inputs.version }}
          flavor: latest=false
          labels: org.opencontainers.image.revision=${{ inputs.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,version=2,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=${{ inputs.cache-scope }}-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "$IMAGE_NAME@$DIGEST"
          mkdir -p digests
          jq -n --arg digest "$DIGEST" --arg arch "$ARCH" --arg sha "$SOURCE_SHA" \
            --arg version "$VERSION" --arg run_id "$GITHUB_RUN_ID" \
            '{digest: $digest, arch: $arch, sha: $sha, version: $version, run_id: $run_id}' > "digests/$ARCH.json"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
    concurrency:
      group: docker-publish-${{ inputs.alias || inputs.version }}
      cancel-in-progress: false
      queue: max
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download digests from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and sign manifests
        id: publish
        run: |
          IMAGE_NAME=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ARCHES=(amd64 arm64)
          DIGESTS=()
          # Validate both records before updating any public tag. A failed matrix
          # job prevents this job from running; retries may reuse a successful sibling.
          for arch in "${ARCHES[@]}"; do
            DIGEST=$(jq -er --arg arch "$arch" --arg sha "$SOURCE_SHA" \
              --arg version "$VERSION" --arg run_id "$GITHUB_RUN_ID" \
              'select(.arch == $arch and .sha == $sha and .version == $version and .run_id == $run_id)
               | .digest | select(test("^sha256:[a-f0-9]{64}$"))' "digests/$arch.json")
            DIGESTS+=("$DIGEST")
          done

          TAGS=(-t "$IMAGE_NAME:$VERSION")
          if [[ -n "$ALIAS" ]]; then
            TAGS+=(-t "$IMAGE_NAME:$ALIAS")
          fi
          docker buildx imagetools create --metadata-file manifest.json "${TAGS[@]}" \
            "$IMAGE_NAME@${DIGESTS[0]}" "$IMAGE_NAME@${DIGESTS[1]}"
          DIGEST=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[a-f0-9]{64}$"))' manifest.json)
          cosign sign --yes "$IMAGE_NAME@$DIGEST"

          for i in "${!ARCHES[@]}"; do
            arch=${ARCHES[$i]}
            TAGS=(-t "$IMAGE_NAME:$VERSION-$arch")
            if [[ -n "$ALIAS" ]]; then
              TAGS+=(-t "$IMAGE_NAME:$ALIAS-$arch")
            fi
            docker buildx imagetools create "${TAGS[@]}" "$IMAGE_NAME@${DIGESTS[$i]}"
          done
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo '### Multi-arch image'
            echo "Version: $IMAGE_NAME:$VERSION"
            if [[ -n "$ALIAS" ]]; then
              echo "Alias: $IMAGE_NAME:$ALIAS"
            fi
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
