name: Build Electron App

on:
  push:
    tags:
      - '*'  # Triggers on version tags like v1.0.0
      - '!*-*'  # Ignore pre-release tags like v1.0.0-beta
      - '!*-alpha*' # Ignore alpha tags like v1.0.0-alpha
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Electron version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 0 }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags)
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    uses: ./.github/workflows/build-frontend.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  build:
    name: Build Electron app (Windows)
    needs: [prepare, frontend]
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.26'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Download frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact_id }}
          path: web/dist
          merge-multiple: true

      - name: Build Go binary (Windows)
        run: |
          test -s web/dist/index.html
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api.exe

      - name: Configure Electron cache paths
        run: |
          {
            echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache"
            echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache"
          } >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Update Electron version
        working-directory: electron
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Build Electron app (Windows)
        working-directory: electron
        run: npm run build:win

      - name: Upload artifacts (Windows)
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: electron/dist/*.exe
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    name: Publish Electron release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: windows-build
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: windows-build/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
