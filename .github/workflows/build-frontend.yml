name: Build frontend artifact

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string
      version:
        description: Version embedded in the frontend
        required: true
        type: string
    outputs:
      artifact-name:
        description: Frontend artifact in this workflow run
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        env:
          CI: ''
          NODE_OPTIONS: --max-old-space-size=4096
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ inputs.version }}
        run: bun run build

      - name: Name frontend artifact
        id: artifact
        run: echo "artifact-name=web-dist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
